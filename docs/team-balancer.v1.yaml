openapi: 3.0.3
info:
  title: Team Balancer API
  description: API for managing team player data.
  version: 0.0.1
servers:
  - url: http://localhost:3000/api
    description: Local development server
paths:
  /teams/{id}:
    get:
      summary: Get team player data
      description: Retrieve the player data for a specific team by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the team.
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved team data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersJson'
              example:
                version: '1.0'
                players:
                  - name: 'Alice'
                    desiredRoles: [true, false, true, false, true]
                    isRoleFixed: false
                    tier: 'GOLD'
                    rank: 'II'
                    displayRank: 'GOLD II'
                    rating: 1400
        '400':
          description: Invalid or missing team ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Invalid or missing team ID'
        '404':
          description: Team not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Team not found'
    put:
      summary: Update team player data
      description: Save or update the player data for a specific team by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the team.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayersJson'
            example:
              version: '1.0'
              players:
                - name: 'Bob'
                  desiredRoles: [true, true, false, false, true]
                  isRoleFixed: true
                  tier: 'PLATINUM'
                  rank: 'I'
                  displayRank: 'PLATINUM I'
                  rating: 1900
      responses:
        '200':
          description: Successfully updated team data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                message: 'Team data saved successfully'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Invalid request body'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Method PUT Not Allowed'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Internal Server Error'
    delete:
      summary: Delete match history and recalculate ratings
      description: Delete a specific match history and replay remaining histories to recalculate player ratings.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the team.
          schema:
            type: string
        - name: historyId
          in: query
          required: true
          description: The ID of the match history to delete.
          schema:
            type: string
      responses:
        '200':
          description: Successfully deleted match history and recalculated ratings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersJson'
        '400':
          description: Invalid or missing history ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Invalid or missing history ID'
        '404':
          description: Team not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Team not found'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Internal Server Error'
components:
  schemas:
    PlayersJson:
      type: object
      properties:
        id:
          type: string
          example: 'team-20260503-001'
        version:
          type: string
          example: '1.0'
        playersTotalCount:
          type: integer
          example: 10
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerJson'
        matchHistories:
          type: array
          items:
            $ref: '#/components/schemas/MatchHistory'
    PlayerJson:
      type: object
      properties:
        id:
          type: string
          example: 'player-001'
        name:
          type: string
          example: 'Alice'
        desiredRoles:
          type: array
          items:
            type: string
          example: ['TOP', 'MID']
        isRoleFixed:
          type: boolean
          example: false
        tier:
          type: string
          example: 'GOLD'
        rank:
          type: string
          example: 'II'
        displayRank:
          type: string
          example: 'GOLD II'
        rating:
          type: number
          example: 1400
        mainRole:
          type: string
          example: 'MID'
        subRole:
          type: string
          example: 'JG'
    MatchHistory:
      type: object
      properties:
        id:
          type: string
          example: 'history-001'
        playedAt:
          type: string
          format: date-time
          example: '2026-05-03T12:30:00.000Z'
        winnerTeam:
          type: string
          enum: ['blue', 'red']
        mismatchCount:
          type: integer
          example: 1
        teamsSnapshot:
          type: array
          items:
            $ref: '#/components/schemas/TeamsSnapshotPlayer'
        playerResults:
          type: array
          items:
            $ref: '#/components/schemas/PlayerResult'
    TeamsSnapshotPlayer:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        team:
          type: string
          enum: ['blue', 'red']
        role:
          type: string
          enum: ['TOP', 'JG', 'MID', 'BOT', 'SUP']
    PlayerResult:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        team:
          type: string
          enum: ['blue', 'red']
        result:
          type: string
          enum: ['win', 'lose']
        ratingDelta:
          type: number
          description: Eloベース計算によるレート変動値（勝敗と期待勝率で変動）
          example: 14
        ratingBefore:
          type: number
          example: 1370
        ratingAfter:
          type: number
          example: 1384
    Error:
      type: object
      properties:
        error:
          type: string
          example: 'Error message'
    Success:
      type: object
      properties:
        message:
          type: string
          example: 'Success message'
